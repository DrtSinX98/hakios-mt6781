# devices/spaced/device.conf: the phone, for the common repository's device tooling (tools/hakios-device.py).
# Its SoC's layer is the common repository's mtk/mt6781/ (branch mt6781). Started from hakios-mt6768 (Infinix Hot 20).
device spaced
	title	realme 8i (spaced)
	vendor	realme
	soc	mt6781
	defconfig	spaced_defconfig
	firmware	pull-firmware.sh
	maintainer	DrtSinX98
	status display partial the framebuffer LK leaves (1080x2412): SpringBoard's home screen drawn in software
	status touch missing
	status buttons works power and volume: volume down on the keypad, volume up and power on the MT6358 (buttons=3)
	status cpu missing
	status gpu missing
	status storage partial read only: the system image in xnusys on the UFS (LUN 2) as the root, polled (mtkufs=1 mtkufs_root=1, mtkloader XNU_ROOT_UFS=1); no writes
	status sensors missing
	status wifi missing
	status bluetooth missing
	status audio missing
	status battery missing
	status haptic missing
	status camera missing
	status torch missing
	status cellular missing
	status thermal missing
